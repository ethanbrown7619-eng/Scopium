name = "scopium"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Hyperdrive proxies your Supabase Postgres connection through Cloudflare's
# edge connection pool. Create one with:
#   wrangler hyperdrive create scopium-db --connection-string="$SUPABASE_URL"
# Then paste the printed `id` here.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_ME"

# Required Worker secrets (set via `wrangler secret put NAME`):
#   AI_API_KEY      — your provider key (Anthropic, OpenAI, or Google)
#   DATABASE_URL    — Supabase pooler URL (only needed if you skip Hyperdrive)
#
# Optional vars: AI_PROVIDER (anthropic|openai|google), AI_MODEL (override
# default for the chosen provider). These can also be set as plain `[vars]`
# entries below if you don't mind committing them.
[vars]
# AI_PROVIDER = "anthropic"
# AI_MODEL = "claude-sonnet-4-6"

[observability]
enabled = true
