name: Seed Companies

# Populates Supabase with NZ companies + directors. Default is synthetic
# data (no third-party key needed). Switch source to `api` if you have
# registered for a Companies Register OAuth token and added it as the
# NZ_COMPANIES_REGISTER_TOKEN secret.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many companies to ingest
        required: true
        default: "200"
      source:
        description: Data source
        required: true
        default: "synthetic"
        type: choice
        options:
          - synthetic
          - api

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run seed
        run: pnpm --filter @scopium/web db:seed -- --limit=${{ inputs.limit }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_SOURCE: ${{ inputs.source }}
          NZ_COMPANIES_REGISTER_TOKEN: ${{ secrets.NZ_COMPANIES_REGISTER_TOKEN }}
