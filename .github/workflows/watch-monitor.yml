name: Watchlist Monitor

# Re-sweeps every watched person and records findings for new information.
# Runs daily by default; also triggerable manually from the Actions tab.
# The user is "notified" by new items appearing in /person/watchlist (and, if
# configured, by email — future enhancement).

on:
  schedule:
    - cron: "0 19 * * *" # 07:00 NZDT (19:00 UTC) daily
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run monitor
        run: pnpm --filter @scopium/web monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISQUALIFIED_DIRECTORS_API_KEY: ${{ secrets.DISQUALIFIED_DIRECTORS_API_KEY }}
