name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/build-scopium-platform-ZBcpM
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext bundle
        run: pnpm --filter @scopium/web cf:build

      - name: Deploy Worker (creates it on first run)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Attach runtime secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          printf '%s' "$AI_API_KEY"   | npx wrangler@4.86.0 secret put AI_API_KEY
          printf '%s' "$DATABASE_URL" | npx wrangler@4.86.0 secret put DATABASE_URL
